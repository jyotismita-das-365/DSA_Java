  <canvas id="mycanvas" width="200" height="100" style="border: 1px solid #1f1a1a;"></canvas>

  <script>
    var canvas = document.getElementById('mycanvas');
    var ctx = canvas.getContext("2d");
    ctx.moveTo(0,0);
    ctx.lineTo(200,100);
    ctx.stroke();
  </script>
